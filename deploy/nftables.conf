# Applied atomically with `nft -f`. Every statement is idempotent so the SAME
# file is safe as both ExecStart and ExecReload: `add table/set/chain` create on
# first boot and no-op afterwards WITHOUT flushing the guest_ifaces set, while
# `flush chain` empties only the rule chains. Because the whole file is one nft
# transaction there is never a window in which the drop rules are absent, and a
# reload while guests are running preserves their interface-set membership — so
# the firewall can never fail open.

add table inet sandbox_host

# Interface set: sandboxd adds each guest's host veth here at VM creation and
# removes it at teardown. Declared with `add set` so re-applying the ruleset
# leaves the live membership intact.
add set inet sandbox_host guest_ifaces { type ifname; }

add chain inet sandbox_host prerouting { type nat hook prerouting priority dstnat; policy accept; }
add chain inet sandbox_host input { type filter hook input priority -10; policy accept; }
add chain inet sandbox_host forward { type filter hook forward priority -10; policy accept; }

flush chain inet sandbox_host prerouting
flush chain inet sandbox_host input
flush chain inet sandbox_host forward

# Transparent-proxy redirects: only DNS/HTTP/HTTPS from a guest interface reach
# the egress gateway. Everything else falls through to the drop rules below.
add rule inet sandbox_host prerouting iifname @guest_ifaces udp dport 53 redirect to :1053
add rule inet sandbox_host prerouting iifname @guest_ifaces tcp dport 53 redirect to :1053
add rule inet sandbox_host prerouting iifname @guest_ifaces tcp dport 80 redirect to :10080
add rule inet sandbox_host prerouting iifname @guest_ifaces tcp dport 443 redirect to :10443

# Host input: a guest may only reach the redirected proxy ports; all other
# host-directed traffic (SSH, Tailscale, metadata, other services) is dropped.
add rule inet sandbox_host input iifname @guest_ifaces ct state established,related accept
add rule inet sandbox_host input iifname @guest_ifaces udp dport 1053 accept
add rule inet sandbox_host input iifname @guest_ifaces tcp dport { 10080, 10443 } accept
add rule inet sandbox_host input iifname @guest_ifaces drop

# Forwarding: guests may never be routed anywhere (no direct-IP egress, no
# inter-guest traffic, no Tailnet/metadata). Return traffic to a guest is
# permitted only for connections the host itself established.
add rule inet sandbox_host forward iifname @guest_ifaces drop
add rule inet sandbox_host forward oifname @guest_ifaces ct state established,related accept
