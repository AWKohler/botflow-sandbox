table inet sandbox_host {
  set guest_ifaces {
    type ifname
  }

  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname @guest_ifaces udp dport 53 redirect to :1053
    iifname @guest_ifaces tcp dport 53 redirect to :1053
    iifname @guest_ifaces tcp dport 80 redirect to :10080
    iifname @guest_ifaces tcp dport 443 redirect to :10443
  }

  chain input {
    type filter hook input priority -10; policy accept;
    iifname @guest_ifaces ct state established,related accept
    iifname @guest_ifaces udp dport 1053 accept
    iifname @guest_ifaces tcp dport { 10080, 10443 } accept
    iifname @guest_ifaces drop
  }

  chain forward {
    type filter hook forward priority -10; policy accept;
    iifname @guest_ifaces drop
    oifname @guest_ifaces ct state established,related accept
  }
}

